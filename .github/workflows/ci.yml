# Runs on every push to main and on pull requests. Needs no dependencies, secrets or network access to the lab:
# the tests and syntax checks use only Node itself, and read-only repository access.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to exact commits (the comment names the release) so a moved tag cannot change what runs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Syntax check (server, workers, providers)
        run: npm run check
      - name: Syntax check (browser scripts)
        run: for file in apps/web/*.js; do node --check "$file"; done
      - name: Syntax check (deploy script)
        run: bash -n deploy/upgrade-nuvrion.sh
      - name: Database migrations are well formed
        run: npm run migrate:check
      - name: Tests
        run: npm test
