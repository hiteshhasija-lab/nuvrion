openapi: 3.1.0
info: { title: Nuvrion API, version: 0.1.0 }
servers: [{ url: /api/v1 }]
paths:
  /auth/login:
    post:
      operationId: login
      responses: { '200': { description: Authenticated session }, '401': { description: Login failed } }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses: { '200': { description: Current user }, '401': { description: Authentication required } }
  /connections:
    get:
      operationId: listConnections
      responses: { '200': { description: Connection collection }, '401': { description: Authentication required } }
    post:
      operationId: createConnection
      responses: { '201': { description: Connection created }, '403': { description: Permission or CSRF denied } }
  /connections/{connectionId}/discover:
    post:
      operationId: discoverConnectionResources
      parameters: [{ in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Discovery synchronization summary }, '404': { description: Connection not found }, '422': { description: Provider unavailable } }
  /connections/{connectionId}/test:
    post:
      operationId: testProviderConnection
      parameters: [{ in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Provider connection is healthy }, '401': { description: Provider authentication failed }, '403': { description: Provider permission denied }, '503': { description: Provider unavailable } }
  /resources:
    get:
      operationId: listResources
      parameters:
        - { in: query, name: connectionId, schema: { type: string, format: uuid } }
        - { in: query, name: resourceType, schema: { type: string } }
        - { in: query, name: lifecycleState, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
      responses: { '200': { description: Normalized infrastructure resource collection } }
  /resources/{resourceId}:
    get:
      operationId: getResource
      parameters: [{ in: path, name: resourceId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Normalized infrastructure resource }, '404': { description: Resource not found } }
  /resources/{resourceId}/operations:
    post:
      operationId: createResourceOperation
      parameters:
        - { in: path, name: resourceId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses: { '202': { description: Lifecycle task accepted }, '200': { description: Existing idempotent task }, '409': { description: State or concurrency conflict }, '422': { description: Unsupported operation } }
  /audit-events:
    get:
      operationId: listAuditEvents
      responses: { '200': { description: Audit event collection }, '403': { description: Permission denied } }
  /platform/metrics:
    get:
      operationId: getPlatformMetrics
      responses: { '200': { description: Platform metrics }, '403': { description: Permission denied } }
  /health:
    get:
      operationId: getHealth
      responses: { '200': { description: Platform health } }
  /tasks:
    get:
      operationId: listTasks
      responses: { '200': { description: Task collection } }
  /tasks/{taskId}:
    get:
      operationId: getTask
      parameters: [{ in: path, name: taskId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Task }, '404': { description: Not found } }
  /mock/operations:
    post:
      operationId: createMockOperation
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      responses: { '201': { description: Task created } }
