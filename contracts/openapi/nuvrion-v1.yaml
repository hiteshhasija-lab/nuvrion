      tags: [Resources]
      operationId: getResource
      x-required-permission: resource.view
      responses:
        '200': { description: The resource, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /resources/{resourceId}/metrics:
    get:
      tags: [Resources]
      operationId: getResourceMetrics
      x-required-permission: resource.view
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { in: query, name: hours, schema: { type: integer, minimum: 1, maximum: 168 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Performance history, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceMetrics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /resources/{resourceId}/operations:
    post:
      tags: [Resources]
      operationId: createResourceOperation
      summary: Start, stop, restart, pause or power off a VM (idempotent)
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [operation], properties: { operation: { $ref: '#/components/schemas/LifecycleOperation' } } } } }
      responses:
        '202': { description: Lifecycle task accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '200': { description: The task already created with this Idempotency-Key, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { description: Idempotency-Key is missing, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /resources/{resourceId}/settings:
    parameters: [{ $ref: '#/components/parameters/ResourceId' }]
