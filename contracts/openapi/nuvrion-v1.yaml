      parameters: [{ $ref: '#/components/parameters/ResourceId' }, { in: query, name: path, schema: { type: string, maxLength: 1024 } }]
      responses:
        '200': { description: A folder listing, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/{resourceId}/media/{driveId}:
