      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [completed, failed, rejected] }, result: { type: [object, 'null'] } } } } }
      responses:
        '200': { description: The command with its recorded result, content: { application/json: { schema: { $ref: '#/components/schemas/AgentCommandResult' } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: nuvrion_session, description: HttpOnly session cookie set by login. }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token, description: The session's CSRF token (returned by login); required on every request that changes something. }
    agentSecret: { type: apiKey, in: header, name: X-Agent-Secret, description: The secret issued to an enrolled Workstation agent. }
  parameters:
    UserId: { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
    ConnectionId: { in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }
    ResourceId: { in: path, name: resourceId, required: true, schema: { type: string, format: uuid } }
    TaskId: { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
    AgentId: { in: path, name: agentId, required: true, schema: { type: string, format: uuid } }
    SnapshotId: { in: path, name: snapshotId, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    IfMatch: { in: header, name: If-Match, required: true, description: 'The row version being changed, quoted, as returned in the ETag or rowVersion.', schema: { type: string } }
  responses:
    Unauthorized: { description: Not signed in (NUV_AUTH_REQUIRED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AgentUnauthorized: { description: Agent authentication failed (NUV_AGENT_AUTH_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: 'The role lacks the permission (NUV_PERMISSION_DENIED) or the CSRF token is missing or wrong (NUV_CSRF_INVALID)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: The thing asked for does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: The request conflicts with the current state, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: The request is understood but not valid or not supported here, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionFailed: { description: The If-Match version is stale (NUV_VERSION_CONFLICT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionRequired: { description: If-Match is required (NUV_PRECONDITION_REQUIRED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Throttled: { description: Too many failed sign-ins; try again after Retry-After seconds (NUV_LOGIN_THROTTLED), headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unavailable: { description: The provider is unreachable or failing; retry later, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    Problem:
      description: The error body of every non-2xx response.
      type: object
      required: [type, title, status, detail, code, correlationId, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string, pattern: '^NUV_[A-Z0-9_]+$' }
        correlationId: { type: string, format: uuid }
        retryable: { type: boolean }
    ItemList:
      type: object
      required: [items, count]
      properties: { items: { type: array }, count: { type: integer, minimum: 0 } }
    ListMeta:
      type: object
      required: [correlationId]
      properties: { correlationId: { type: string, format: uuid } }
    Health:
      type: object
      required: [status, version, correlationId, components, metrics]
      properties:
        status: { type: string }
        version: { type: string }
        correlationId: { type: string, format: uuid }
        components: { type: object, required: [api, database, broker, worker], properties: { api: { type: string }, database: { type: string }, broker: { type: string }, worker: { type: string }, mockProvider: { type: string } } }
        metrics: { $ref: '#/components/schemas/PlatformMetricsCounts' }
    Readiness:
      type: object
      required: [status, components, issues, profile, correlationId]
      properties:
        status: { type: string, enum: [ready, not_ready, degraded] }
        components: { type: object }
        issues: { type: array }
        profile: { type: string }
        correlationId: { type: string, format: uuid }
    PlatformMetricsCounts:
      type: object
      required: [tasksTotal, tasksQueued, tasksRunning, tasksCompleted, tasksFailed, auditEvents, outboxUnpublished, resourcesTotal, resourcesActive, resourcesMissing]
      properties:
        tasksTotal: { type: integer }
        tasksQueued: { type: integer }
        tasksRunning: { type: integer }
        tasksCompleted: { type: integer }
        tasksFailed: { type: integer }
        auditEvents: { type: integer }
        outboxUnpublished: { type: integer }
        resourcesTotal: { type: integer }
        resourcesActive: { type: integer }
        resourcesMissing: { type: integer }
    PlatformMetrics:
      allOf:
        - { $ref: '#/components/schemas/PlatformMetricsCounts' }
        - { type: object, required: [correlationId], properties: { correlationId: { type: string, format: uuid } } }
    PlatformUpgradeStatus:
      type: object
      required: [currentVersion, helperAvailable, status]
      properties:
        currentVersion: { type: string }
        helperAvailable: { type: boolean }
        status: { type: object, required: [state, message], properties: { state: { type: string }, message: { type: string }, updatedAt: { type: [string, 'null'], format: date-time } } }
        staged: { type: [object, 'null'] }
    StagedUpgrade:
      type: object
      required: [uploadId, sha256, sizeBytes]
      properties: { uploadId: { type: string }, fileName: { type: [string, 'null'] }, sha256: { type: string }, sizeBytes: { type: integer }, stagedAt: { type: string, format: date-time } }

    UserStatus: { type: string, enum: [active, pending, locked, disabled] }
    RoleName: { type: string, enum: [platform_admin, operator, auditor] }
    User:
      type: object
      required: [id, username, displayName, status, roles, permissions, rowVersion]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleName' } }
        permissions: { type: array, items: { type: string } }
        rowVersion: { type: integer, minimum: 1 }
    UserWithRecoveryCode:
      type: object
      required: [user, recoveryCode]
      properties: { user: { $ref: '#/components/schemas/User' }, recoveryCode: { type: string } }
    RecoveryCode:
      type: object
      required: [recoveryCode]
      properties: { recoveryCode: { type: string } }
    RevokedCount:
      type: object
      required: [revoked]
      properties: { revoked: { type: integer, minimum: 0 } }
    UserList:
      type: object
      required: [items, nextCursor, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SessionPolicy:
      type: object
      required: [idleTimeoutMs, absoluteTimeoutMs]
      properties: { idleTimeoutMs: { type: integer }, absoluteTimeoutMs: { type: integer } }
    AuthSession:
      type: object
      required: [user, csrfToken, expiresAt, sessionPolicy]
      properties:
        user: { $ref: '#/components/schemas/User' }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
        sessionPolicy: { $ref: '#/components/schemas/SessionPolicy' }
    SessionInfo:
      type: object
      required: [id, createdAt, lastSeenAt, idleExpiresAt, absoluteExpiresAt, current]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        idleExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
        current: { type: boolean }
    SessionList:
      type: object
      required: [items, count, sessionPolicy]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SessionInfo' } }
        count: { type: integer }
        sessionPolicy: { $ref: '#/components/schemas/SessionPolicy' }

    ProviderType: { type: string, enum: [vmware_vsphere, vmware_workstation, aws, azure] }
    ConnectionCreate:
      type: object
      required: [name, providerType, credential]
      properties:
        name: { type: string, minLength: 1 }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        connectionType: { type: string }
        endpointUri: { type: [string, 'null'] }
        credential: { type: object, minProperties: 1, description: Write-only; never returned. }
        configuration: { type: object }
    Connection:
      type: object
      required: [id, name, providerType, connectionType, endpointUri, configuration, status, healthState, lastSuccessAt, lastSyncAt, resourceCount, consecutiveFailures, lastErrorCode, nextRetryAt, rowVersion, createdAt, updatedAt, etag]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        connectionType: { type: string }
        endpointUri: { type: [string, 'null'] }
        configuration: { type: object }
        status: { type: string, enum: [enabled, disabled, deleted] }
        healthState: { type: string }
        lastSuccessAt: { type: [string, 'null'], format: date-time }
        lastSyncAt: { type: [string, 'null'], format: date-time }
        resourceCount: { type: integer, minimum: 0 }
        consecutiveFailures: { type: integer, minimum: 0 }
        lastErrorCode: { type: [string, 'null'] }
        nextRetryAt: { type: [string, 'null'], format: date-time }
        rowVersion: { type: integer, minimum: 1 }
        createdBy: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        etag: { type: string }
      not: { anyOf: [{ required: [credential] }, { required: [secret] }, { required: [password] }], description: Credentials are never returned. }
    ConnectionList:
      type: object
      required: [items, nextCursor, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Connection' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }
    DiscoverySummary:
      type: object
      required: [connectionId, observedAt, discovered, created, updated, missing]
      properties:
        connectionId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        discovered: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        missing: { type: integer }
        metricsRecorded: { type: integer }
        reconciliation: { type: array }
    ConnectionTestResult:
      type: object
      required: [status]
      properties: { status: { type: string }, provider: { type: string } }
    ConnectionDiagnostics:
      type: object
      required: [connection, items, count, lastFailure, stale]
      properties:
        connection: { type: object, required: [id, name, providerType, healthState, consecutiveFailures], properties: { id: { type: string, format: uuid }, name: { type: string }, providerType: { type: string }, healthState: { type: string }, lastSuccessAt: { type: [string, 'null'] }, lastSyncAt: { type: [string, 'null'] }, consecutiveFailures: { type: integer }, lastErrorCode: { type: [string, 'null'] }, nextRetryAt: { type: [string, 'null'] } } }
        items: { type: array, items: { type: object, required: [id, connectionId, checkType, outcome, durationMs, checkedAt], properties: { id: { type: string, format: uuid }, connectionId: { type: string, format: uuid }, checkType: { type: string }, outcome: { type: string, enum: [succeeded, failed] }, errorCode: { type: [string, 'null'] }, durationMs: { type: integer }, checkedAt: { type: string, format: date-time } } } }
        count: { type: integer }
        lastFailure: { type: [object, 'null'] }
        stale: { type: boolean }
    ConnectionAlert:
      type: object
      required: [id, connectionId, connectionName, severity, status, errorCode, occurrenceCount, openedAt, lastSeenAt, acknowledgedAt, acknowledgedBy, recoveredAt]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        connectionName: { type: string }
        severity: { type: string }
        status: { type: string, enum: [active, acknowledged, recovered] }
        errorCode: { type: [string, 'null'] }
        occurrenceCount: { type: integer, minimum: 1 }
        openedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        acknowledgedBy: { type: [string, 'null'], format: uuid }
        recoveredAt: { type: [string, 'null'], format: date-time }
    ConnectionAlertList:
      type: object
      required: [items, count, activeCount, criticalCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConnectionAlert' } }
        count: { type: integer }
        activeCount: { type: integer }
        criticalCount: { type: integer }

    Capability:
      type: object
      required: [operation, enabled]
      properties:
        operation: { type: string }
        enabled: { type: boolean }
        providerSemantics: { type: string }
        reason: { type: [string, 'null'] }
    Resource:
      type: object
      required: [id, connectionId, providerType, resourceType, nativeId, name, lifecycleState, healthState, observedAt, firstSeenAt, lastSeenAt, version, attributes, capabilities]
      properties:
        id: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
        providerType: { $ref: '#/components/schemas/ProviderType' }
        resourceType: { type: string }
        nativeId: { type: string }
        name: { type: string }
        lifecycleState: { type: string, enum: [active, missing, deleted] }
        healthState: { type: string }
        observedAt: { type: string, format: date-time }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        missingSince: { type: [string, 'null'], format: date-time }
        version: { type: integer, minimum: 1 }
        attributes: { type: object, properties: { powerState: { type: string }, guestOs: { type: [string, 'null'] }, vcpuCount: { type: [integer, 'null'] }, memoryBytes: { type: [integer, 'null'] }, storageBytes: { type: [integer, 'null'] }, privateIps: { type: array, items: { type: string } } } }
        providerMetadata: { type: object }
        providerMetadataHash: { type: string }
        capabilities: { type: array, items: { $ref: '#/components/schemas/Capability' } }
    ResourceList:
      type: object
      required: [items, nextCursor, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Resource' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }
    ResourceRef:
      type: object
      required: [id, name, providerType]
      properties: { id: { type: string, format: uuid }, name: { type: string }, providerType: { type: string } }
    PerformanceSample:
      type: object
      required: [id, resourceId, observedAt, source]
      properties:
        id: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        cpuUtilizationPercent: { type: [number, 'null'] }
        cpuUsageMhz: { type: [number, 'null'] }
        memoryUtilizationPercent: { type: [number, 'null'] }
        memoryUsedBytes: { type: [number, 'null'] }
        memoryActiveBytes: { type: [number, 'null'] }
        storageUsedBytes: { type: [number, 'null'] }
        networkRxBytesPerSec: { type: [number, 'null'] }
        networkTxBytesPerSec: { type: [number, 'null'] }
        source: { type: string }
    ResourceMetrics:
      type: object
      required: [resource, latest, items, count, hours, available]
      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        latest: { oneOf: [{ $ref: '#/components/schemas/PerformanceSample' }, { type: 'null' }] }
        items: { type: array, items: { $ref: '#/components/schemas/PerformanceSample' } }
        count: { type: integer }
        hours: { type: integer, minimum: 1, maximum: 168 }
        available: { type: boolean }
    ResourceSettings:
      type: object
      required: [resource, provider, settings]
      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        provider: { type: string }
        settings: { type: object, required: [name, powerState, cpuCount, memoryMB], properties: { name: { type: string }, annotation: { type: string }, guestId: { type: string }, powerState: { type: string }, cpuCount: { type: integer }, coresPerSocket: { type: integer }, memoryMB: { type: integer }, hardware: { type: object } } }
    ResourceSettingsUpdate:
      description: Any of the editable settings. Fields that are not listed here are ignored; a listed field outside its range is a 422.
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        annotation: { type: string, maxLength: 1024 }
        cpuCount: { type: integer, minimum: 1, maximum: 768 }
        coresPerSocket: { type: integer, minimum: 1, maximum: 768 }
        memoryMB: { type: integer, minimum: 4, maximum: 25165824 }
        bootDelayMs: { type: integer, minimum: 0, maximum: 600000 }
    ProviderActionResult:
      description: What a provider action (settings change, snapshot delete or revert, media mount or eject) reports; some add details such as snapshotId, isoPath or drive.
      type: object
      required: [code, summary]
      properties: { code: { type: string }, summary: { type: string }, snapshotId: { type: string }, isoPath: { type: string }, drive: { type: object } }
    Snapshot:
      type: object
      required: [id, name, createdAt]
      properties: { id: { type: string }, name: { type: string }, description: { type: string }, createdAt: { type: string, format: date-time }, powerState: { type: string }, quiesced: { type: boolean }, includeMemory: { type: boolean }, current: { type: boolean }, parentId: { type: [string, 'null'] }, depth: { type: integer }, childCount: { type: integer } }
    SnapshotList:
      type: object
      required: [resource, provider, currentSnapshotId, items]
      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        provider: { type: string }
        currentSnapshotId: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/Snapshot' } }
    SnapshotResult:
      allOf:
        - { $ref: '#/components/schemas/ProviderActionResult' }
        - { type: object, required: [snapshot, items], properties: { snapshot: { $ref: '#/components/schemas/Snapshot' }, currentSnapshotId: { type: [string, 'null'] }, items: { type: array, items: { $ref: '#/components/schemas/Snapshot' } } } }
    ResourceMedia:
      type: object
      required: [resource, provider, drives]
      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        provider: { type: string }
        drives: { type: array, items: { type: object, required: [id, connected], properties: { id: { type: string }, label: { type: string }, media: { type: [string, 'null'] }, connected: { type: boolean }, startConnected: { type: boolean } } } }
        datastores: { type: array }
        images: { type: array }
        warnings: { type: array }
    ConsoleSession:
      type: object
      required: [sessionId, resourceId, consoleUrl, transport, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        consoleUrl: { type: string }
        transport: { type: string }
        expiresAt: { type: string, format: date-time }
        credential: { type: object, description: One-time console credential, present only for some transports. }

    LifecycleOperation: { type: string, enum: [start, stop, power_off, reboot_guest, restart, pause] }
    TaskStatus: { type: string, enum: [queued, running, completed, failed, cancelled, verification_required] }
    TaskError:
      type: object
      required: [code]
      properties: { code: { type: string }, detail: { type: string }, retryable: { type: boolean } }
    Task:
      type: object
      required: [id, operation, status, target, correlationId, queuedAt, startedAt, completedAt, progress, result, error]
      properties:
        id: { type: string, format: uuid }
        operation: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        target: { type: object, required: [id, type], properties: { id: { type: string }, type: { type: string } } }
        providerNativeId: { type: [string, 'null'] }
        connectionId: { type: [string, 'null'], format: uuid }
        requestedBy: { oneOf: [{ type: object, required: [id, username], properties: { id: { type: string, format: uuid }, username: { type: string } } }, { type: 'null' }] }
        correlationId: { type: string, format: uuid }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        progress: { type: object, required: [current, total, messageCode], properties: { current: { type: integer }, total: { type: integer }, messageCode: { type: string } } }
        result: { type: [object, 'null'] }
        error: { oneOf: [{ $ref: '#/components/schemas/TaskError' }, { type: 'null' }] }
        retryAt: { type: [string, 'null'], format: date-time }
        providerReference: { type: [string, 'null'] }
        overrodeTaskId: { type: [string, 'null'], format: uuid }
    TaskAttempt:
      type: object
      required: [id, taskId, attemptNo, workerId, startedAt]
      properties: { id: { type: string, format: uuid }, taskId: { type: string, format: uuid }, attemptNo: { type: integer, minimum: 1 }, workerId: { type: string }, startedAt: { type: string, format: date-time }, completedAt: { type: [string, 'null'], format: date-time }, outcome: { type: [string, 'null'] } }
    TaskDetail:
      allOf:
        - { $ref: '#/components/schemas/Task' }
        - { type: object, required: [attempts], properties: { attempts: { type: array, items: { $ref: '#/components/schemas/TaskAttempt' } } } }
    TaskList:
      type: object
      required: [items, nextCursor, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }

    AuditEvent:
      type: object
      required: [id, occurredAt, actorType, action, correlationId, outcome, detail]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorType: { type: string }
        actorId: { type: [string, 'null'], format: uuid }
        actorName: { type: [string, 'null'] }
        action: { type: string }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        taskId: { type: [string, 'null'], format: uuid }
        correlationId: { type: string, format: uuid }
        outcome: { type: string }
        detail: { type: object }
    AuditEventPage:
      type: object
      required: [items, nextCursor, count, page, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer, description: Total events matching the filter. }
        page: { type: object, required: [limit, offset], properties: { limit: { type: integer }, offset: { type: integer } } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    AgentCompatibility:
      type: object
      required: [compatible, upgradeRequired, upgradeAvailable, agentVersion]
      properties: { compatible: { type: boolean }, upgradeRequired: { type: boolean }, upgradeAvailable: { type: boolean }, minimumVersion: { type: string }, recommendedVersion: { type: string }, agentVersion: { type: string } }
    Agent:
      type: object
      required: [id, name, version, status, enrolledAt, lastHeartbeatAt, compatibility]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [online, offline, revoked] }
        enrolledAt: { type: string, format: date-time }
        lastHeartbeatAt: { type: string, format: date-time }
        inventory: { type: array }
        diagnostics: { type: [object, 'null'] }
        compatibility: { $ref: '#/components/schemas/AgentCompatibility' }
        revokedAt: { type: string, format: date-time }
        revocationReason: { type: string }
        secretRotatedAt: { type: string, format: date-time }
      not: { anyOf: [{ required: [secret] }, { required: [secretHash] }], description: The agent's secret is never returned after enrollment or rotation. }
    AgentList:
      type: object
      required: [items, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        count: { type: integer }
