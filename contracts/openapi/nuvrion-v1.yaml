      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        provider: { type: string }
        currentSnapshotId: { type: [string, 'null'] }
        items: { type: array, items: { $ref: '#/components/schemas/Snapshot' } }
    SnapshotResult:
      allOf:
        - { $ref: '#/components/schemas/ProviderActionResult' }
        - { type: object, required: [snapshot, items], properties: { snapshot: { $ref: '#/components/schemas/Snapshot' }, currentSnapshotId: { type: [string, 'null'] }, items: { type: array, items: { $ref: '#/components/schemas/Snapshot' } } } }
    ResourceMedia:
      type: object
      required: [resource, provider, drives]
      properties:
        resource: { $ref: '#/components/schemas/ResourceRef' }
        provider: { type: string }
        drives: { type: array, items: { type: object, required: [id, connected], properties: { id: { type: string }, label: { type: string }, media: { type: [string, 'null'] }, connected: { type: boolean }, startConnected: { type: boolean } } } }
        datastores: { type: array }
        images: { type: array }
        warnings: { type: array }
    ConsoleSession:
      type: object
      required: [sessionId, resourceId, consoleUrl, transport, expiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        consoleUrl: { type: string }
        transport: { type: string }
        expiresAt: { type: string, format: date-time }
        credential: { type: object, description: One-time console credential, present only for some transports. }

    LifecycleOperation: { type: string, enum: [start, stop, power_off, reboot_guest, restart, pause] }
    TaskStatus: { type: string, enum: [queued, running, completed, failed, cancelled, verification_required] }
    TaskError:
      type: object
      required: [code]
      properties: { code: { type: string }, detail: { type: string }, retryable: { type: boolean } }
    Task:
      type: object
      required: [id, operation, status, target, correlationId, queuedAt, startedAt, completedAt, progress, result, error]
      properties:
        id: { type: string, format: uuid }
        operation: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        target: { type: object, required: [id, type], properties: { id: { type: string }, type: { type: string } } }
        providerNativeId: { type: [string, 'null'] }
        connectionId: { type: [string, 'null'], format: uuid }
        requestedBy: { oneOf: [{ type: object, required: [id, username], properties: { id: { type: string, format: uuid }, username: { type: string } } }, { type: 'null' }] }
        correlationId: { type: string, format: uuid }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        progress: { type: object, required: [current, total, messageCode], properties: { current: { type: integer }, total: { type: integer }, messageCode: { type: string } } }
        result: { type: [object, 'null'] }
        error: { oneOf: [{ $ref: '#/components/schemas/TaskError' }, { type: 'null' }] }
        retryAt: { type: [string, 'null'], format: date-time }
        providerReference: { type: [string, 'null'] }
        overrodeTaskId: { type: [string, 'null'], format: uuid }
    TaskAttempt:
      type: object
      required: [id, taskId, attemptNo, workerId, startedAt]
      properties: { id: { type: string, format: uuid }, taskId: { type: string, format: uuid }, attemptNo: { type: integer, minimum: 1 }, workerId: { type: string }, startedAt: { type: string, format: date-time }, completedAt: { type: [string, 'null'], format: date-time }, outcome: { type: [string, 'null'] } }
    TaskDetail:
      allOf:
        - { $ref: '#/components/schemas/Task' }
        - { type: object, required: [attempts], properties: { attempts: { type: array, items: { $ref: '#/components/schemas/TaskAttempt' } } } }
    TaskList:
      type: object
      required: [items, nextCursor, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }

    AuditEvent:
      type: object
      required: [id, occurredAt, actorType, action, correlationId, outcome, detail]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorType: { type: string }
        actorId: { type: [string, 'null'], format: uuid }
        actorName: { type: [string, 'null'] }
        action: { type: string }
        targetType: { type: [string, 'null'] }
        targetId: { type: [string, 'null'] }
        taskId: { type: [string, 'null'], format: uuid }
        correlationId: { type: string, format: uuid }
        outcome: { type: string }
        detail: { type: object }
    AuditEventPage:
      type: object
      required: [items, nextCursor, count, page, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer, description: Total events matching the filter. }
        page: { type: object, required: [limit, offset], properties: { limit: { type: integer }, offset: { type: integer } } }
        meta: { $ref: '#/components/schemas/ListMeta' }

    AgentCompatibility:
      type: object
      required: [compatible, upgradeRequired, upgradeAvailable, agentVersion]
      properties: { compatible: { type: boolean }, upgradeRequired: { type: boolean }, upgradeAvailable: { type: boolean }, minimumVersion: { type: string }, recommendedVersion: { type: string }, agentVersion: { type: string } }
    Agent:
      type: object
      required: [id, name, version, status, enrolledAt, lastHeartbeatAt, compatibility]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [online, offline, revoked] }
        enrolledAt: { type: string, format: date-time }
        lastHeartbeatAt: { type: string, format: date-time }
        inventory: { type: array }
        diagnostics: { type: [object, 'null'] }
        compatibility: { $ref: '#/components/schemas/AgentCompatibility' }
        revokedAt: { type: string, format: date-time }
        revocationReason: { type: string }
        secretRotatedAt: { type: string, format: date-time }
      not: { anyOf: [{ required: [secret] }, { required: [secretHash] }], description: The agent's secret is never returned after enrollment or rotation. }
    AgentList:
      type: object
      required: [items, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Agent' } }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }
    AgentCommand:
      description: A command signed with the agent's secret (HMAC-SHA256 over the payload).
      type: object
      required: [payload, signature]
      properties:
        payload: { type: object, required: [commandId, agentId, operation, issuedAt, expiresAt, nonce], properties: { commandId: { type: string, format: uuid }, agentId: { type: string, format: uuid }, operation: { type: string }, targetId: { type: [string, 'null'] }, issuedAt: { type: string, format: date-time }, expiresAt: { type: string, format: date-time }, nonce: { type: string } } }
        signature: { type: string, minLength: 1 }
    AgentCommandResult:
      type: object
      required: [commandId, agentId, operation, issuedAt, expiresAt, nonce, status, completedAt]
      properties: { commandId: { type: string, format: uuid }, agentId: { type: string, format: uuid }, operation: { type: string }, targetId: { type: [string, 'null'] }, issuedAt: { type: string }, expiresAt: { type: string }, nonce: { type: string }, requestedBy: { type: [string, 'null'] }, status: { type: string, enum: [completed, failed, rejected] }, result: { type: [object, 'null'] }, completedAt: { type: string, format: date-time } }
    AgentUpgradePolicy:
      type: object
      required: [agentId, autoUpgrade, windowStart, windowEnd, windowTimezone]
      properties:
        agentId: { type: string, format: uuid }
        autoUpgrade: { type: boolean }
        windowStart: { type: [string, 'null'] }
        windowEnd: { type: [string, 'null'] }
        windowTimezone: { type: string }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: [string, 'null'] }
    AgentUpgradeDeployment:
      type: object
      required: [deploymentId, agentId, releaseId, status, stagedAt]
      properties:
        deploymentId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        releaseId: { type: string, format: uuid }
        status: { type: string }
        stagedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        rollbackVersion: { type: [string, 'null'] }
        detail: { type: [string, object, 'null'] }
        release: { $ref: '#/components/schemas/AgentRelease' }
        trustedPublicKey: { type: string }
    AgentRelease:
      type: object
      required: [manifest, signature]
      properties:
        manifest: { type: object, required: [releaseId, version, artifactUrl, sha256, sizeBytes, signingKeyId, createdAt], properties: { releaseId: { type: string, format: uuid }, version: { type: string }, artifactUrl: { type: string }, sha256: { type: string, pattern: '^[a-f0-9]{64}$' }, sizeBytes: { type: integer }, signingKeyId: { type: string }, createdAt: { type: string, format: date-time } } }
        signature: { type: string }
