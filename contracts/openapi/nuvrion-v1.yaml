      responses:
        '200': { description: Image ejected, content: { application/json: { schema: { $ref: '#/components/schemas/ProviderActionResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /resources/{resourceId}/console-sessions:
    post:
      tags: [Resources]
      operationId: createConsoleSession
      summary: Open an embedded console (the socket itself is a WebSocket)
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '201': { description: Console session created, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      x-required-permission: resource.view
      responses:
        '200': { description: Recent tasks, newest first, content: { application/json: { schema: { $ref: '#/components/schemas/TaskList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      x-required-permission: resource.view
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { description: The task with its attempts, content: { application/json: { schema: { $ref: '#/components/schemas/TaskDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tasks/{taskId}/cancel:
    post:
      tags: [Tasks]
      operationId: cancelTask
      summary: Cancel a task that has not started
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { description: Task cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks/{taskId}/retry:
    post:
      tags: [Tasks]
      operationId: retryTask
      summary: Run a failed task again
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '202': { description: Task queued again, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks/{taskId}/reconcile:
    post:
      tags: [Tasks]
      operationId: reconcileTask
      summary: Check a verification-required task against the provider and settle it
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200': { description: Reconciliation outcome, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /mock/operations:
    post:
      tags: [Mock]
      operationId: createMockOperation
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ in: header, name: Idempotency-Key, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [operation], properties: { operation: { $ref: '#/components/schemas/LifecycleOperation' }, targetId: { type: string } } } } }
      responses:
        '201': { description: Task created, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '200': { description: The task already created with this Idempotency-Key, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        '400': { description: Idempotency-Key is missing, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      x-required-permission: audit.view
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 250, default: 100 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: action, schema: { type: string } }
        - { in: query, name: outcome, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
      responses:
        '200': { description: A page of audit events, newest first, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      x-required-permission: platform.manage
      responses:
        '200': { description: Enrolled Workstation agents, content: { application/json: { schema: { $ref: '#/components/schemas/AgentList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agents/enrollment-tokens:
    post:
      tags: [Agents]
      operationId: createAgentEnrollmentToken
      summary: A single-use token (valid for 10 minutes) for enrolling one agent; shown once
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Enrollment token, content: { application/json: { schema: { type: object, required: [id, token, expiresAt], properties: { id: { type: string, format: uuid }, token: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agents/enroll:
    post:
      tags: [Agents]
      operationId: enrollAgent
      summary: Exchange an enrollment token for the agent's identity and secret (no sign-in; the token is the credential)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string }, name: { type: string }, version: { type: string } } } } }
      responses:
        '201': { description: Agent enrolled, content: { application/json: { schema: { type: object, required: [agentId, secret, enrolledAt], properties: { agentId: { type: string, format: uuid }, secret: { type: string }, enrolledAt: { type: string, format: date-time } } } } } }
        '401': { description: The token is invalid, expired or already used (NUV_AGENT_ENROLLMENT_INVALID), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /agents/maintenance/sweep:
    post:
      tags: [Agents]
      operationId: sweepAgents
      summary: Mark silent agents offline and expire undelivered commands
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { offlineAfterMs: { type: integer, minimum: 1, default: 120000 } } } } }
      responses:
        '200': { description: Sweep result, content: { application/json: { schema: { type: object, required: [offline, expiredCommands, sweptAt], properties: { offline: { type: integer }, expiredCommands: { type: integer }, sweptAt: { type: string, format: date-time } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agent-upgrades/releases:
    post:
      tags: [Agents]
      operationId: registerAgentRelease
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [version, artifactUrl, sha256, sizeBytes], properties: { version: { type: string }, artifactUrl: { type: string, pattern: '^https://' }, sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }, sizeBytes: { type: integer, minimum: 1 } } } } }
      responses:
        '201': { description: Release registered and signed, content: { application/json: { schema: { $ref: '#/components/schemas/AgentRelease' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [Agents]
      operationId: listAgentReleases
      summary: Registered agent releases, newest first, and whether each executable is on the platform
      x-required-permission: platform.manage
      parameters:
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200': { description: The releases, content: { application/json: { schema: { type: object, required: [items, count, signingKeyId], properties: { items: { type: array, items: { type: object, required: [manifest, signature, artifactAvailable], properties: { manifest: { type: object }, signature: { type: string }, artifactAvailable: { type: boolean } } } }, count: { type: integer }, signingKeyId: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agent-upgrades/builds:
    post:
      tags: [Agents]
      operationId: uploadAgentBuild
      summary: Upload a Workstation agent executable and register it as a signed release
      description: The body is the executable itself. It is hashed while it streams, must be a Windows executable within the size limit, and is kept under its SHA-256. The release's download address is the platform address agents use (baseUrl, or the address this request came to).
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { in: query, name: version, required: true, description: The version the executable reports with --self-check, schema: { type: string, pattern: '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$', maxLength: 32 } }
        - { in: query, name: sha256, required: false, description: When given, the upload is refused unless it hashes to this, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' } }
        - { in: query, name: baseUrl, required: false, description: The https address agents use for the platform (origin only); defaults to the address of this request, schema: { type: string, pattern: '^https://' } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        '201': { description: Stored and registered, content: { application/json: { schema: { type: object, required: [release, artifact], properties: { release: { $ref: '#/components/schemas/AgentRelease' }, artifact: { type: object, required: [sha256, sizeBytes], properties: { sha256: { type: string }, sizeBytes: { type: integer } } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: The executable is larger than the limit, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '503': { description: The platform cannot write to its agent upgrade directory (permission or space), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '415': { description: The body is not application/octet-stream, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /agents/{agentId}/upgrade-deployments:
    get:
      tags: [Agents]
      operationId: listAgentUpgradeDeployments
      summary: An agent's upgrade deployments, newest first, with the version and the agent's own reported detail
      x-required-permission: platform.manage
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { in: query, name: limit, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: The deployments, content: { application/json: { schema: { type: object, required: [items, count], properties: { items: { type: array, items: { type: object, required: [deploymentId, status, version], properties: { deploymentId: { type: string, format: uuid }, releaseId: { type: string, format: uuid }, status: { type: string }, version: { type: [string, 'null'] }, sha256: { type: [string, 'null'] }, stagedAt: { type: string, format: date-time }, completedAt: { type: [string, 'null'] }, rollbackVersion: { type: [string, 'null'] }, detail: { type: [string, object, 'null'] } } } }, count: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agentId}/upgrade-deployments/{deploymentId}/cancel:
    post:
      tags: [Agents]
      operationId: cancelAgentUpgrade
      summary: Cancel an upgrade that has not finished, so the agent's queue is free again
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { in: path, name: deploymentId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: The cancelled deployment (recorded as failed with the operator named), content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpgradeDeployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agents/{agentId}/rotate-secret:
    post:
      tags: [Agents]
      operationId: rotateAgentSecret
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200': { description: New secret (shown once), content: { application/json: { schema: { type: object, required: [agentId, secret, rotatedAt], properties: { agentId: { type: string, format: uuid }, secret: { type: string }, rotatedAt: { type: string, format: date-time } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agentId}/revoke:
    post:
      tags: [Agents]
      operationId: revokeAgent
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { reason: { type: string } } } } }
      responses:
        '200': { description: The revoked agent; queued commands are rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agent-upgrades/settings:
    get:
      tags: [Agents]
      operationId: getAgentUpgradeSettings
      summary: The address agents use for this platform, and how many published builds are waiting for it to be set
      x-required-permission: platform.manage
      responses:
        '200': { description: The settings, content: { application/json: { schema: { type: object, required: [publicBaseUrl, buildsWaiting], properties: { publicBaseUrl: { type: [string, 'null'] }, updatedAt: { type: [string, 'null'] }, updatedBy: { type: [string, 'null'] }, buildsWaiting: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Agents]
      operationId: updateAgentUpgradeSettings
      summary: Set the address agents use for this platform; builds published by the host that were waiting for it are registered
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [publicBaseUrl], properties: { publicBaseUrl: { type: string, pattern: '^https://' } } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { type: object, required: [publicBaseUrl, imported], properties: { publicBaseUrl: { type: string }, updatedAt: { type: string }, updatedBy: { type: [string, 'null'] }, imported: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { description: The platform cannot write to its agent upgrade directory (permission or space), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /agent-upgrades/policies:
    get:
      tags: [Agents]
      operationId: listAgentUpgradePolicies
      summary: Which agents are set to upgrade automatically, and their time windows
      x-required-permission: platform.manage
      responses:
        '200': { description: The policies (an agent with none is not upgraded automatically), content: { application/json: { schema: { type: object, required: [items, count], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentUpgradePolicy' } }, count: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agents/{agentId}/upgrade-policy:
    put:
      tags: [Agents]
      operationId: setAgentUpgradePolicy
      summary: Turn automatic upgrades on or off for an agent, optionally within a daily time window
      description: When on, the platform stages the newest build on the platform for this agent when it is online, behind, inside the window, no other agent is being upgraded, and that build has not already failed on it.
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [autoUpgrade], properties: { autoUpgrade: { type: boolean }, windowStart: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }, windowEnd: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }, windowTimezone: { type: string } } } } }
      responses:
        '200': { description: The policy, content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpgradePolicy' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /agent-upgrades/signing-key:
    get:
      tags: [Agents]
      operationId: getAgentUpgradeSigningKey
      summary: The public key that verifies agent upgrade manifests (what to pin in an agent's bootstrap.json)
      x-required-permission: platform.manage
      responses:
        '200': { description: The key, content: { application/json: { schema: { type: object, required: [signingKeyId, publicKey], properties: { signingKeyId: { type: string }, publicKey: { type: string, description: PEM (SPKI) public key } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /agent-upgrades/artifacts/{sha256}:
    get:
      tags: [Agents]
      operationId: downloadAgentUpgradeArtifact
      summary: Called by the agent itself; the executable of a release staged for it
      security: [{ agentSecret: [] }]
      parameters:
        - { in: path, name: sha256, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { in: header, name: X-Agent-Id, required: true, description: The id of the enrolled agent asking, schema: { type: string, format: uuid } }
      responses:
        '200': { description: The executable, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agents/{agentId}/upgrades:
    get:
      tags: [Agents]
      operationId: listAgentPendingUpgrades
      summary: Called by the agent itself
      security: [{ agentSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200': { description: Upgrades staged for this agent, content: { application/json: { schema: { type: object, required: [items, count], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentUpgradeDeployment' } }, count: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
    post:
      tags: [Agents]
      operationId: stageAgentUpgrade
      summary: Stage a registered release for one agent
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [releaseId], properties: { releaseId: { type: string, format: uuid } } } } }
      responses:
        '201': { description: Upgrade staged, content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpgradeDeployment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The executable of the release is not on the platform, or the agent already has an upgrade that has not finished, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /agents/{agentId}/upgrades/{deploymentId}/report:
    post:
      tags: [Agents]
      operationId: reportAgentUpgrade
      summary: Called by the agent itself
      security: [{ agentSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { in: path, name: deploymentId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [downloading, ready, installed, failed, rolled_back] }, rollbackVersion: { type: [string, 'null'] }, detail: { type: [string, object, 'null'] } } } } }
      responses:
        '200': { description: Report recorded, content: { application/json: { schema: { $ref: '#/components/schemas/AgentUpgradeDeployment' } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /agents/{agentId}/heartbeat:
    post:
      tags: [Agents]
      operationId: agentHeartbeat
      summary: Called by the agent itself every few seconds with its version, discovered VMs and diagnostics
      security: [{ agentSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { version: { type: string }, inventory: { type: array, items: { type: object } }, diagnostics: { type: [object, 'null'] } } } } }
      responses:
        '200': { description: The agent's record, content: { application/json: { schema: { $ref: '#/components/schemas/Agent' } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
  /agents/{agentId}/commands:
    get:
      tags: [Agents]
      operationId: listAgentPendingCommands
      summary: Called by the agent itself; returns the signed commands waiting for it
      security: [{ agentSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200': { description: Signed commands, content: { application/json: { schema: { type: object, required: [items, count], properties: { items: { type: array, items: { $ref: '#/components/schemas/AgentCommand' } }, count: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
    post:
      tags: [Agents]
      operationId: createAgentCommand
      summary: Queue a signed command (start, stop, power off, restart, pause, console, media) for one agent
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [operation], properties: { operation: { type: string, enum: [start, stop, power_off, reboot_guest, restart, pause, console, media.browse, media.mount, media.eject] }, targetId: { type: string }, ttlMs: { type: integer, minimum: 1, default: 60000 } } } } }
      responses:
        '201': { description: Command queued; the signature covers the payload, content: { application/json: { schema: { $ref: '#/components/schemas/AgentCommand' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /agents/{agentId}/commands/{commandId}/ack:
    post:
      tags: [Agents]
      operationId: acknowledgeAgentCommand
      summary: Called by the agent itself; a command can be acknowledged once
      security: [{ agentSecret: [] }]
      parameters: [{ $ref: '#/components/parameters/AgentId' }, { in: path, name: commandId, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [completed, failed, rejected] }, result: { type: [object, 'null'] } } } } }
      responses:
        '200': { description: The command with its recorded result, content: { application/json: { schema: { $ref: '#/components/schemas/AgentCommandResult' } } } }
        '401': { $ref: '#/components/responses/AgentUnauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: nuvrion_session, description: HttpOnly session cookie set by login. }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-Token, description: The session's CSRF token (returned by login); required on every request that changes something. }
    agentSecret: { type: apiKey, in: header, name: X-Agent-Secret, description: The secret issued to an enrolled Workstation agent. }
  parameters:
    UserId: { in: path, name: userId, required: true, schema: { type: string, format: uuid } }
    ConnectionId: { in: path, name: connectionId, required: true, schema: { type: string, format: uuid } }
    ResourceId: { in: path, name: resourceId, required: true, schema: { type: string, format: uuid } }
    TaskId: { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
    AgentId: { in: path, name: agentId, required: true, schema: { type: string, format: uuid } }
    SnapshotId: { in: path, name: snapshotId, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
    IfMatch: { in: header, name: If-Match, required: true, description: 'The row version being changed, quoted, as returned in the ETag or rowVersion.', schema: { type: string } }
  responses:
    Unauthorized: { description: Not signed in (NUV_AUTH_REQUIRED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    AgentUnauthorized: { description: Agent authentication failed (NUV_AGENT_AUTH_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: 'The role lacks the permission (NUV_PERMISSION_DENIED), the CSRF token is missing or wrong (NUV_CSRF_INVALID), the session has not finished two-factor sign-in (NUV_MFA_REQUIRED), or the person must choose a new password first (NUV_PASSWORD_CHANGE_REQUIRED)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: The thing asked for does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: The request conflicts with the current state, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unprocessable: { description: The request is understood but not valid or not supported here, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionFailed: { description: The If-Match version is stale (NUV_VERSION_CONFLICT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PreconditionRequired: { description: If-Match is required (NUV_PRECONDITION_REQUIRED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Throttled: { description: Too many failed sign-ins; try again after Retry-After seconds (NUV_LOGIN_THROTTLED), headers: { Retry-After: { schema: { type: integer } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unavailable: { description: The provider is unreachable or failing; retry later, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  schemas:
    Problem:
      description: The error body of every non-2xx response.
      type: object
      required: [type, title, status, detail, code, correlationId, retryable]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        code: { type: string, pattern: '^NUV_[A-Z0-9_]+$' }
        correlationId: { type: string, format: uuid }
        retryable: { type: boolean }
    ItemList:
      type: object
      required: [items, count]
      properties: { items: { type: array }, count: { type: integer, minimum: 0 } }
    ListMeta:
      type: object
      required: [correlationId]
      properties: { correlationId: { type: string, format: uuid } }
    Health:
      type: object
      required: [status, version, correlationId, components, metrics]
      properties:
        status: { type: string }
        version: { type: string }
        correlationId: { type: string, format: uuid }
        components: { type: object, required: [api, database, broker, worker], properties: { api: { type: string }, database: { type: string }, broker: { type: string }, worker: { type: string }, mockProvider: { type: string } } }
        metrics: { $ref: '#/components/schemas/PlatformMetricsCounts' }
    Readiness:
      type: object
      required: [status, components, issues, profile, correlationId]
      properties:
        status: { type: string, enum: [ready, not_ready, degraded] }
        components: { type: object }
        issues: { type: array }
        profile: { type: string }
        correlationId: { type: string, format: uuid }
    PlatformMetricsCounts:
      type: object
      required: [tasksTotal, tasksQueued, tasksRunning, tasksCompleted, tasksFailed, auditEvents, outboxUnpublished, resourcesTotal, resourcesActive, resourcesMissing]
      properties:
        tasksTotal: { type: integer }
        tasksQueued: { type: integer }
        tasksRunning: { type: integer }
        tasksCompleted: { type: integer }
        tasksFailed: { type: integer }
        auditEvents: { type: integer }
        outboxUnpublished: { type: integer }
        resourcesTotal: { type: integer }
        resourcesActive: { type: integer }
        resourcesMissing: { type: integer }
    PlatformMetrics:
      allOf:
        - { $ref: '#/components/schemas/PlatformMetricsCounts' }
        - { type: object, required: [correlationId], properties: { correlationId: { type: string, format: uuid } } }
    PlatformUpgradeStatus:
      type: object
      required: [currentVersion, helperAvailable, status]
      properties:
        currentVersion: { type: string }
        helperAvailable: { type: boolean }
        status: { type: object, required: [state, message], properties: { state: { type: string }, message: { type: string }, updatedAt: { type: [string, 'null'], format: date-time } } }
        staged: { type: [object, 'null'] }
    StagedUpgrade:
      type: object
      required: [uploadId, sha256, sizeBytes]
      properties: { uploadId: { type: string }, fileName: { type: [string, 'null'] }, sha256: { type: string }, sizeBytes: { type: integer }, stagedAt: { type: string, format: date-time } }

    UserStatus: { type: string, enum: [active, pending, locked, disabled] }
    RoleName: { type: string, description: 'A built-in role (platform_admin, operator, auditor) or a custom one.' }
    PermissionKey: { type: string, enum: [resource.view, resource.operate, resource.tag, connection.view, connection.manage, audit.view, identity.manage, platform.manage, alert.manage, schedule.manage] }
    Permission:
      type: object
      required: [key, group, description, requires]
      properties: { key: { $ref: '#/components/schemas/PermissionKey' }, group: { type: string }, description: { type: string }, requires: { type: array, items: { $ref: '#/components/schemas/PermissionKey' }, description: Permissions a role must also have to have this one } }
    PermissionList:
      type: object
      required: [items, count, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Permission' } }, count: { type: integer }, meta: { $ref: '#/components/schemas/ListMeta' } }
    Role:
      type: object
      required: [id, name, displayName, description, system, permissions, userCount, rowVersion]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/RoleName' }
        displayName: { type: string }
        description: { type: string }
        system: { type: boolean, description: Built-in roles cannot be changed or deleted }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionKey' } }
        userCount: { type: integer, minimum: 0 }
        rowVersion: { type: integer, minimum: 1 }
    RoleList:
      type: object
      required: [items, count, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Role' } }, count: { type: integer }, meta: { $ref: '#/components/schemas/ListMeta' } }
    RoleCreate:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        description: { type: string, maxLength: 200 }
        permissions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PermissionKey' } }
    RoleChange:
      type: object
      required: [permissions]
      properties:
        description: { type: string, maxLength: 200 }
        permissions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PermissionKey' } }
    User:
      type: object
      required: [id, username, displayName, status, roles, permissions, rowVersion]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        status: { $ref: '#/components/schemas/UserStatus' }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleName' } }
        permissions: { type: array, items: { type: string } }
        mfaEnrolled: { type: boolean, description: Whether the user has two-factor sign-in set up }
        mfaRequired: { type: boolean, description: Whether an administrator requires two-step verification for this user }
        mustChangePassword: { type: boolean, description: Whether the person must choose a new password before anything else }
        rowVersion: { type: integer, minimum: 1 }
    UserWithRecoveryCode:
      type: object
      required: [user, recoveryCode]
      properties: { user: { $ref: '#/components/schemas/User' }, recoveryCode: { type: string } }
    RecoveryCode:
      type: object
      required: [recoveryCode]
      properties: { recoveryCode: { type: string } }
    RevokedCount:
      type: object
      required: [revoked]
      properties: { revoked: { type: integer, minimum: 0 } }
    UserList:
      type: object
      required: [items, nextCursor, count, meta]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { type: [string, 'null'] }
        count: { type: integer }
        meta: { $ref: '#/components/schemas/ListMeta' }
    SessionPolicy:
      type: object
      required: [idleTimeoutMs, absoluteTimeoutMs]
      properties: { idleTimeoutMs: { type: integer }, absoluteTimeoutMs: { type: integer } }
    MfaState: { type: string, enum: [verified, verification_required, enrollment_required], description: 'verified: nothing more is needed. verification_required: enter a code. enrollment_required: the role needs two-factor sign-in and it is not set up.' }
    MfaSessionState:
      type: object
      required: [state]
      properties: { state: { $ref: '#/components/schemas/MfaState' } }
    MfaStatus:
      type: object
      required: [enrolled, enrolledAt, backupCodesRemaining, required, state]
      properties:
        enrolled: { type: boolean }
        enrolledAt: { type: [string, 'null'], format: date-time }
        backupCodesRemaining: { type: integer, minimum: 0 }
        required: { type: boolean, description: An administrator requires two-step verification for this account }
        state: { $ref: '#/components/schemas/MfaState' }
    MfaCode:
      type: object
      description: Exactly one of code (six digits, spaces allowed) or backupCode.
      properties: { code: { type: string }, backupCode: { type: string } }
    MfaVerified:
      type: object
      required: [state, method, backupCodesRemaining]
      properties: { state: { type: string, enum: [verified] }, method: { type: string, enum: [totp, backup] }, backupCodesRemaining: { type: integer, minimum: 0 } }
    MfaEnrollment:
      type: object
      required: [secret, uri, account, issuer]
      properties: { secret: { type: string }, uri: { type: string }, account: { type: string }, issuer: { type: string } }
    MfaBackupCodes:
      type: object
      required: [state, backupCodes]
      properties: { state: { type: string, enum: [verified] }, backupCodes: { type: array, items: { type: string } } }
    UserCreate:
      type: object
      required: [username, displayName, password, roles]
      properties:
        username: { type: string, description: '3 to 128 letters, digits, dots, hyphens or underscores' }
        displayName: { type: string, maxLength: 200 }
        password: { type: string, minLength: 12 }
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RoleName' } }
        mfaRequired: { type: boolean, description: Require two-step verification for the person (default false) }
        mustChangePassword: { type: boolean, description: The person must choose their own password at first sign-in (default true) }
    PasswordSet:
      type: object
      required: [password]
      properties: { password: { type: string, minLength: 12 }, mustChange: { type: boolean, description: The person must choose their own at next sign-in (default true) } }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties: { currentPassword: { type: string }, newPassword: { type: string, minLength: 12 } }
    AlertMetric:
      type: object
      required: [key, kind, label, unit, max]
      properties: { key: { type: string }, kind: { type: string, enum: [vm, host, datastore, cluster] }, label: { type: string }, unit: { type: string }, max: { type: number } }
    AlertMetricList:
      type: object
      required: [items, count, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AlertMetric' } }, count: { type: integer }, meta: { $ref: '#/components/schemas/ListMeta' } }
    AlertRuleCreate:
      type: object
      required: [name, metric, comparison, threshold, severity]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        metric: { type: string }
        comparison: { type: string, enum: [above, below] }
        threshold: { type: number, minimum: 0 }
        durationMinutes: { type: integer, minimum: 0, maximum: 1440, description: How long the condition must hold before the alert fires (default 0) }
        severity: { type: string, enum: [warning, critical] }
        connectionId: { type: [string, 'null'], format: uuid, description: Only targets of this connection (default all) }
        enabled: { type: boolean }
    AlertRuleChange:
      type: object
      description: Any of the fields of a rule; the rest are kept.
      properties:
        name: { type: string }
        description: { type: string }
        metric: { type: string }
        comparison: { type: string, enum: [above, below] }
        threshold: { type: number }
        durationMinutes: { type: integer }
        severity: { type: string, enum: [warning, critical] }
        connectionId: { type: [string, 'null'] }
        enabled: { type: boolean }
    AlertRule:
      type: object
      required: [id, name, description, metric, comparison, threshold, durationMinutes, severity, connectionId, enabled, rowVersion, createdAt, updatedAt, openAlertCount, summary]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        metric: { type: string }
        comparison: { type: string, enum: [above, below] }
        threshold: { type: number }
        durationMinutes: { type: integer }
        severity: { type: string, enum: [warning, critical] }
        connectionId: { type: [string, 'null'] }
        enabled: { type: boolean }
        rowVersion: { type: integer, minimum: 1 }
        createdBy: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        openAlertCount: { type: integer, minimum: 0 }
        summary: { type: string, description: 'The rule in words, e.g. Virtual machine CPU use above 90% for 10 minutes' }
    AlertRuleList:
      type: object
      required: [items, count, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/AlertRule' } }, count: { type: integer }, meta: { $ref: '#/components/schemas/ListMeta' } }
    AlertRulePreview:
      type: object
      required: [summary, evaluated, unmeasured, matches]
      properties:
        summary: { type: string }
        evaluated: { type: integer, description: Targets with a fresh measurement }
        unmeasured: { type: integer, description: Targets with no fresh measurement (not counted as matching) }
        matches: { type: array, items: { type: object, required: [id, name, value], properties: { id: { type: string }, name: { type: string }, value: { type: number } } } }
    Alert:
      type: object
      required: [id, ruleId, ruleName, metric, comparison, threshold, severity, targetKind, targetId, targetName, connectionId, value, status, firstSeenAt, lastSeenAt, acknowledgedAt, acknowledgedBy, resolvedAt, resolvedReason]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: [string, 'null'], description: Null once the rule has been deleted }
        ruleName: { type: string }
        metric: { type: string }
        comparison: { type: string }
        threshold: { type: number }
        severity: { type: string, enum: [warning, critical] }
        targetKind: { type: string, enum: [vm, host, datastore, cluster] }
        targetId: { type: string }
        targetName: { type: string }
        connectionId: { type: [string, 'null'] }
        value: { type: number, description: The latest value that held the alert open }
        status: { type: string, enum: [active, acknowledged, resolved] }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        acknowledgedAt: { type: [string, 'null'] }
        acknowledgedBy: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'] }
        resolvedReason: { type: [string, 'null'], description: 'cleared, rule_disabled, rule_deleted, scope_changed or target_gone' }
    AlertList:
      type: object
      required: [items, count, openCount, criticalCount, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Alert' } }, count: { type: integer }, openCount: { type: integer }, criticalCount: { type: integer }, meta: { $ref: '#/components/schemas/ListMeta' } }
    AlertEvaluation:
      type: object
      required: [fired, refreshed, resolved, stale, rules, evaluatedAt]
      properties: { fired: { type: integer }, refreshed: { type: integer }, resolved: { type: integer }, stale: { type: integer, description: Targets skipped because their measurements are older than ten minutes }, rules: { type: integer, description: Enabled rules }, evaluatedAt: { type: string, format: date-time } }
    NotificationEvent:
      type: object
      required: [id, kind, at, source, alertId, severity, title, detail]
      properties:
        id: { type: string }
        kind: { type: string, enum: [fired, resolved] }
        at: { type: string, format: date-time }
        source: { type: string, enum: [threshold, connection] }
        alertId: { type: string }
        severity: { type: string, enum: [warning, critical] }
        title: { type: string }
        detail: { type: string }
    NotificationList:
      type: object
      required: [items, count, unreadCount, lastReadAt, meta]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/NotificationEvent' } }, count: { type: integer }, unreadCount: { type: integer, description: Events newer than the caller last read (the last day's, for someone who never has) }, lastReadAt: { type: [string, 'null'] }, meta: { $ref: '#/components/schemas/ListMeta' } }
    ScheduleCreate:
      type: object
      required: [name, operation, targetKind, frequency, timeOfDay]
      properties:
        name: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 300 }
        operation: { type: string, enum: [start, stop, power_off, pause, reboot_guest, restart] }
        targetKind: { type: string, enum: [vms, tag], description: 'vms: the machines listed in vmIds; tag: the machines that have the tag when the run happens' }
        vmIds: { type: array, items: { type: string, format: uuid }, maxItems: 50 }
        tag: { type: string, description: 'A tag key (any value) or key=value' }
        connectionId: { type: [string, 'null'], format: uuid, description: Only machines of this connection (schedules by tag only) }
        frequency: { type: string, enum: [once, daily, weekly] }
        timeOfDay: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 is Sunday (weekly schedules) }
        runDate: { type: string, description: 'YYYY-MM-DD (schedules that run once)' }
        timeZone: { type: string, description: 'An IANA time zone such as Europe/London (default UTC)' }
        enabled: { type: boolean }
    ScheduleChange:
      type: object
      description: Any of the fields of a schedule; the rest are kept.
      properties:
        name: { type: string }
        description: { type: string }
        operation: { type: string }
        targetKind: { type: string }
        vmIds: { type: array, items: { type: string } }
        tag: { type: [string, 'null'] }
        connectionId: { type: [string, 'null'] }
        frequency: { type: string }
        timeOfDay: { type: string }
        weekdays: { type: array, items: { type: integer } }
        runDate: { type: [string, 'null'] }
        timeZone: { type: string }
        enabled: { type: boolean }
    ScheduleRun:
      type: object
      required: [id, scheduleId, scheduleName, operation, trigger, scheduledFor, startedAt, outcome, matched, submitted, skipped, failed, details, summary]
      properties:
        id: { type: string, format: uuid }
        scheduleId: { type: [string, 'null'], description: Null once the schedule has been deleted }
        scheduleName: { type: string }
        operation: { type: string }
        trigger: { type: string, enum: [schedule, manual] }
        scheduledFor: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'] }
        outcome: { type: string, enum: [completed, partial, failed, skipped, missed, error] }
        matched: { type: integer }
        submitted: { type: integer, description: Machines for which the operation was requested (see Tasks for how each went) }
        skipped: { type: integer, description: Machines not asked, with the reason in details (already in that state, another operation running, gone) }
        failed: { type: integer }
        details: { type: array, items: { type: object, required: [resourceId, result], properties: { resourceId: { type: string }, name: { type: [string, 'null'] }, result: { type: string, enum: [submitted, skipped, failed] }, detail: { type: string }, taskId: { type: string } } } }
        detailsTruncated: { type: boolean }
        error: { type: [string, 'null'] }
        summary: { type: string, description: 'For example 2 requested, 1 skipped' }
    WebhookCreate:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 2048, description: 'The address to post to; write-only' }
        format: { type: string, enum: [json, text, discord], description: 'json: every field; text: {"text": ...} for Slack, Mattermost, Teams and Google Chat; discord: {"content": ...}' }
        events: { type: array, items: { type: string, enum: [alert.fired, alert.resolved, connection.down, connection.recovered, schedule.problem] } }
        minSeverity: { type: string, enum: [warning, critical] }
        signingSecret: { type: string, minLength: 8, maxLength: 200, description: 'When set, every message carries X-Nuvrion-Signature: sha256=HMAC of "<X-Nuvrion-Timestamp>.<body>"; write-only' }
        enabled: { type: boolean }
    WebhookChange:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        url: { type: string, maxLength: 2048 }
        format: { type: string, enum: [json, text, discord] }
        events: { type: array, items: { type: string, enum: [alert.fired, alert.resolved, connection.down, connection.recovered, schedule.problem] } }
        minSeverity: { type: string, enum: [warning, critical] }
        signingSecret: { type: string, nullable: true, description: 'An empty string or null removes the secret' }
        enabled: { type: boolean }
    Webhook:
      type: object
      required: [id, name, format, events, minSeverity, enabled, activeSince, urlHint, hasSigningSecret, consecutiveFailures, lastAttemptAt, lastSuccessAt, lastError, rowVersion, createdAt, updatedAt, pendingCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        format: { type: string, enum: [json, text, discord] }
        events: { type: array, items: { type: string } }
        minSeverity: { type: string, enum: [warning, critical] }
        enabled: { type: boolean }
