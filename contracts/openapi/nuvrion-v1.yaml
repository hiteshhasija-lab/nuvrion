openapi: 3.1.0
info:
  title: Nuvrion API
  version: 0.1.160
  summary: The REST API behind the Nuvrion console.
  description: |
    Every operation below is exercised by the contract tests (apps/api/test/api-contract.test.js), which send real requests to the
    server and check each response against the schema documented here. The route list is also compared with the server's route table, so a
    route cannot be added, removed or renamed without this file changing.

    Sessions use an HttpOnly cookie. Every request that changes something must also send the session's CSRF token in `X-CSRF-Token`
    (it is returned by login). Agents authenticate with `X-Agent-Secret` instead. `x-required-permission` on an operation names the
    permission the caller needs; the three built-in roles are Platform Administrator (all), Operator (resource.view, resource.operate,
    connection.view) and Auditor (resource.view, connection.view, audit.view).

    Changes that remove an operation, a response status or a response field, or that add a required request field, are breaking;
    tools/check-api-compat.js reports them in CI.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - { name: Platform, description: Health, metrics and platform updates }
  - { name: Authentication, description: Sign-in, sessions and recovery }
  - { name: Users, description: User administration }
  - { name: Connections, description: Provider connections, health and alerts }
  - { name: Resources, description: Discovered virtual machines and what can be done to them }
  - { name: Tasks, description: Lifecycle operations and their outcomes }
  - { name: Audit, description: The audit log }
  - { name: Alerts, description: Threshold alert rules, the alerts they raise and the notification feed }
  - { name: Schedules, description: Scheduled operations on machines, and what each run did }
  - { name: Webhooks, description: Where alerts, connection problems and failed schedule runs are sent, and what was sent }
  - { name: Capacity, description: How full each datastore is, how fast it is filling and when it will be full }
  - { name: Agents, description: Workstation agents, enrollment and signed commands }
  - { name: Mock, description: The built-in mock provider }

paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Platform health (no sign-in needed)
      security: []
      responses:
        '200': { description: Platform health, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /readiness:
    get:
      tags: [Platform]
      operationId: getReadiness
      summary: Whether the platform is ready to serve traffic (no sign-in needed)
      security: []
      responses:
        '200': { description: Ready, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        '503': { description: Not ready, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
  /platform/metrics:
    get:
      tags: [Platform]
      operationId: getPlatformMetrics
      x-required-permission: platform.manage
      responses:
        '200': { description: Platform metrics, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformMetrics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/metrics/prometheus:
    get:
      tags: [Platform]
      operationId: getPrometheusMetrics
      x-required-permission: platform.manage
      responses:
        '200': { description: Metrics in the Prometheus text format, content: { text/plain: { schema: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/upgrade:
    get:
      tags: [Platform]
      operationId: getPlatformUpgrade
      x-required-permission: platform.manage
      responses:
        '200': { description: State of the platform update helper and any staged bundle, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformUpgradeStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /platform/upgrade/upload:
    post:
      tags: [Platform]
      operationId: stagePlatformUpgrade
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { in: query, name: sha256, required: true, schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' } }
        - { in: header, name: X-Nuvrion-File-Name, schema: { type: string } }
      requestBody:
        required: true
        content: { application/zip: { schema: { type: string, format: binary } } }
      responses:
        '201': { description: Bundle staged, content: { application/json: { schema: { $ref: '#/components/schemas/StagedUpgrade' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { description: The body is not a ZIP, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /platform/upgrade/start:
    post:
      tags: [Platform]
      operationId: startPlatformUpgrade
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [uploadId], properties: { uploadId: { type: string } } } } }
      responses:
        '202': { description: Update queued, content: { application/json: { schema: { $ref: '#/components/schemas/StagedUpgrade' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in; sets the session cookie and returns the CSRF token
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } } } }
      responses:
        '200':
          description: Authenticated session
          headers: { Set-Cookie: { description: The HttpOnly session cookie, schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } }
        '401': { description: Username or password is incorrect (NUV_LOGIN_FAILED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Request an account (lab recovery mode only); the account is pending until an administrator activates it
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, displayName, password], properties: { username: { type: string, pattern: '^[A-Za-z0-9._-]{3,128}$' }, displayName: { type: string, minLength: 1, maxLength: 200 }, password: { type: string, minLength: 12 } } } } }
      responses:
        '201': { description: Account created, content: { application/json: { schema: { $ref: '#/components/schemas/UserWithRecoveryCode' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: That username is taken (NUV_USERNAME_EXISTS), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'The username (3 to 128 letters, digits, dots, hyphens or underscores), the display name (1 to 200 characters) or the password (at least 12 characters) is not valid (NUV_SIGNUP_INVALID)', content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/password-reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Reset a password with a recovery code (lab recovery mode only)
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, recoveryCode, newPassword], properties: { username: { type: string }, recoveryCode: { type: string }, newPassword: { type: string, minLength: 12 } } } } }
      responses:
        '200': { description: Password changed; a new recovery code is issued, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCode' } } } }
        '401': { description: Username or recovery code is incorrect, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      responses:
        '200': { description: The signed-in user, content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions:
    get:
      tags: [Authentication]
      operationId: listOwnSessions
      responses:
        '200': { description: The caller's active sessions, content: { application/json: { schema: { $ref: '#/components/schemas/SessionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/sessions/{sessionId}:
    delete:
      tags: [Authentication]
      operationId: revokeOwnSession
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ in: path, name: sessionId, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{64}$' } }]
      responses:
        '200': { description: Session revoked, content: { application/json: { schema: { $ref: '#/components/schemas/RevokedCount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/recovery-code:
    post:
      tags: [Authentication]
      operationId: rotateOwnRecoveryCode
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: A new recovery code (shown once), content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change your own password; your other sessions end, this one carries on
      description: Needs the current password, and a new one of at least 12 characters that differs from it. Also the one call (besides finishing two-step verification and signing out) available to a session that must choose a new password before anything else (403 NUV_PASSWORD_CHANGE_REQUIRED elsewhere). Wrong current passwords are limited (429 NUV_PASSWORD_THROTTLED).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordChange' } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { type: object, required: [changed, otherSessionsEnded], properties: { changed: { type: boolean }, otherSessionsEnded: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: The current password is not right (NUV_PASSWORD_INCORRECT), the new one is too short (NUV_PASSWORD_TOO_SHORT) or the same (NUV_PASSWORD_UNCHANGED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Signed out; the session cookie is cleared }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /users:
    get:
      tags: [Users]
      operationId: listUsers
      x-required-permission: identity.manage
      responses:
        '200': { description: All users, content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createUser
      summary: Create an account with an initial password
      description: The account is active at once. By default the person must choose their own password at first sign-in (mustChangePassword defaults to true), so the initial one is only ever known to the administrator for that long. The roles must exist, and you cannot give a user permissions you do not hold yourself (403 NUV_ROLE_ESCALATION). The password needs at least 12 characters. mfaRequired requires two-step verification for the person.
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserCreate' } } }
      responses:
        '201': { description: The new user, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The username is taken (NUV_USERNAME_EXISTS), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The username, display name, roles or password are not valid (NUV_USER_INVALID, NUV_PASSWORD_TOO_SHORT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /users/{userId}/password:
    post:
      tags: [Users]
      operationId: setUserPassword
      summary: Set a temporary password for a user (a forgotten password); every session of theirs ends
      description: By default the person must choose their own at next sign-in (mustChange defaults to true). You cannot set your own this way (409 NUV_PASSWORD_USE_OWN_CHANGE); use the account menu.
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordSet' } } }
      responses:
        '200': { description: Set, content: { application/json: { schema: { type: object, required: [set, sessionsEnded], properties: { set: { type: boolean }, sessionsEnded: { type: integer, minimum: 0 } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Your own account (NUV_PASSWORD_USE_OWN_CHANGE), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The password is too short or the request is not valid, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /users/{userId}:
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Change a user's status and roles (optimistic concurrency with If-Match)
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status, roles], properties: { status: { $ref: '#/components/schemas/UserStatus' }, roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/RoleName' } }, mfaRequired: { type: boolean, description: Require (or stop requiring) two-step verification for this user; it applies at once, to sessions already open } } } } }
      responses:
        '200': { description: Updated user, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The last active Platform Administrator cannot be removed (NUV_LAST_ADMIN_REQUIRED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /permissions:
    get:
      tags: [Users]
      operationId: listPermissions
      summary: The permissions a role can include, with what each allows
      x-required-permission: identity.manage
      responses:
        '200': { description: The permission catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/PermissionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /roles:
    get:
      tags: [Users]
      operationId: listRoles
      summary: Built-in and custom roles with their permissions and how many users hold each
      x-required-permission: identity.manage
      responses:
        '200': { description: All roles, content: { application/json: { schema: { $ref: '#/components/schemas/RoleList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createRole
      summary: Create a custom role
      description: The name is lower case (a space becomes an underscore) and may use letters, digits, - and _. The role needs at least one permission, and every permission it needs (resource.operate needs resource.view). You cannot give a role permissions you do not have yourself (403 NUV_ROLE_ESCALATION). At most 50 custom roles.
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleCreate' } } }
      responses:
        '201': { description: Role created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The name is taken (NUV_ROLE_EXISTS) or the limit is reached (NUV_ROLE_LIMIT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /roles/{roleName}:
    parameters: [{ name: roleName, in: path, required: true, schema: { $ref: '#/components/schemas/RoleName' } }]
    patch:
      tags: [Users]
      operationId: updateRole
      summary: Change a custom role's description and permissions (optimistic concurrency with If-Match)
      description: Takes effect for everyone who holds the role on their next request. Built-in roles cannot be changed (409 NUV_ROLE_SYSTEM).
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleChange' } } }
      responses:
        '200': { description: Updated role, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Role' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A built-in role (NUV_ROLE_SYSTEM), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Users]
      operationId: deleteRole
      summary: Delete a custom role nobody holds
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A built-in role (NUV_ROLE_SYSTEM) or still held by users (NUV_ROLE_IN_USE), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/mfa:
    get:
      tags: [Authentication]
      operationId: getMfaStatus
      summary: Whether two-factor sign-in is set up, whether an administrator requires it for the caller, and the state of this session
      description: Also available to a session that has not finished two-factor sign-in. Every other call from such a session is refused with 403 NUV_MFA_REQUIRED.
      responses:
        '200': { description: Two-factor status, content: { application/json: { schema: { $ref: '#/components/schemas/MfaStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mfa/verify:
    post:
      tags: [Authentication]
      operationId: verifyMfa
      summary: Finish signing in with a code from the authenticator app, or with a backup code
      description: Send exactly one of code (six digits) or backupCode. A code works once. Five wrong codes end the session (401 NUV_MFA_SESSION_REVOKED); ten in fifteen minutes lock the account for fifteen minutes (429 NUV_MFA_THROTTLED, with Retry-After).
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MfaCode' } } }
      responses:
        '200': { description: The session is verified, content: { application/json: { schema: { $ref: '#/components/schemas/MfaVerified' } } } }
        '401': { description: Too many wrong codes ended the session (NUV_MFA_SESSION_REVOKED), or there is no session, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Two-factor sign-in is not set up (NUV_MFA_NOT_ENROLLED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The code is wrong (NUV_MFA_CODE_INVALID) or the request is not one code (NUV_MFA_REQUEST_INVALID), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/mfa/enrollment:
    post:
      tags: [Authentication]
      operationId: startMfaEnrollment
      summary: Start setting up an authenticator app; returns the secret and the otpauth link for its QR code
      description: Available to a session that must set up two-factor sign-in before it can do anything else. Calling it again replaces the secret that was not yet confirmed.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: The secret to enter or scan, content: { application/json: { schema: { $ref: '#/components/schemas/MfaEnrollment' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Already set up (NUV_MFA_ALREADY_ENROLLED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /auth/mfa/enrollment/confirm:
    post:
      tags: [Authentication]
      operationId: confirmMfaEnrollment
      summary: Finish setting up with a code from the app; returns ten backup codes, once
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Two-factor sign-in is set up and this session is verified, content: { application/json: { schema: { $ref: '#/components/schemas/MfaBackupCodes' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Already set up (NUV_MFA_ALREADY_ENROLLED) or not started (NUV_MFA_ENROLLMENT_NOT_STARTED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The code is wrong (NUV_MFA_CODE_INVALID) or not a code (NUV_MFA_REQUEST_INVALID), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/mfa/backup-codes:
    post:
      tags: [Authentication]
      operationId: regenerateMfaBackupCodes
      summary: Replace the backup codes (the old ones stop working); needs a current code
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Ten new backup codes, shown once, content: { application/json: { schema: { type: object, required: [backupCodes], properties: { backupCodes: { type: array, items: { type: string } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Not set up (NUV_MFA_NOT_ENROLLED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The code is wrong or not a code, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Throttled' }
  /auth/mfa/disable:
    post:
      tags: [Authentication]
      operationId: disableMfa
      summary: Turn two-factor sign-in off for the caller; needs a current code, and is refused when an administrator requires it for the account
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200': { description: Turned off, content: { application/json: { schema: { type: object, required: [disabled], properties: { disabled: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Not set up (NUV_MFA_NOT_ENROLLED) or required for the account by an administrator (NUV_MFA_REQUIRED_FOR_ACCOUNT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: The code is wrong or not a code, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '429': { $ref: '#/components/responses/Throttled' }
  /users/{userId}/mfa:
    delete:
      tags: [Users]
      operationId: resetUserMfa
      summary: Remove a user's two-factor enrolment (a lost device) and end their sessions
      description: They sign in with their password and, if an administrator requires it for the account, set two-factor sign-in up again. The requirement itself is not changed.
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { description: Reset (reset is false when the user had nothing set up), content: { application/json: { schema: { type: object, required: [reset], properties: { reset: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userId}/revoke-sessions:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { description: Sessions ended, content: { application/json: { schema: { $ref: '#/components/schemas/RevokedCount' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/{userId}/recovery-code:
    post:
      tags: [Users]
      operationId: rotateUserRecoveryCode
      x-required-permission: identity.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '200': { description: A new recovery code (shown once), content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryCode' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      x-required-permission: connection.view
      responses:
        '200': { description: All connections (credentials are never returned), content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Connections]
      operationId: createConnection
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionCreate' } } }
      responses:
        '201':
          description: Connection created
          headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /connections/{connectionId}:
    parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
    get:
      tags: [Connections]
      operationId: getConnection
      x-required-permission: connection.view
      responses:
        '200': { description: The connection, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Connections]
      operationId: updateConnection
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1 }, endpointUri: { type: string } } } } }
      responses:
        '200': { description: Updated connection, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [Connections]
      operationId: deleteConnection
      summary: Retire the connection (its inventory history is kept)
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Connection retired, content: { application/json: { schema: { type: object, required: [id, name, status], properties: { id: { type: string, format: uuid }, name: { type: string }, status: { const: deleted } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connections/{connectionId}/credentials:
    post:
      tags: [Connections]
      operationId: replaceConnectionCredential
      summary: Replace the stored credential (write-only; optimistic concurrency with If-Match)
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [credential], properties: { credential: { type: object, minProperties: 1 } } } } }
      responses:
        '200': { description: Credential replaced, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Connection' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /connections/{connectionId}/discover:
    post:
      tags: [Connections]
      operationId: discoverConnectionResources
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200': { description: Discovery synchronization summary, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoverySummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /connections/{connectionId}/test:
    post:
      tags: [Connections]
      operationId: testProviderConnection
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200': { description: The provider connection is healthy, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionTestResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /connections/{connectionId}/diagnostics:
    get:
      tags: [Connections]
      operationId: getConnectionDiagnostics
      x-required-permission: connection.view
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }, { in: query, name: limit, schema: { type: integer, minimum: 1 } }]
      responses:
        '200': { description: Recent checks and the last failure, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionDiagnostics' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /connections/{connectionId}/host-client:
    post:
      tags: [Connections]
      operationId: openEsxiHostClient
      summary: The URL of a standalone ESXi host's web client
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      responses:
        '200': { description: Host Client address, content: { application/json: { schema: { type: object, required: [connectionId, url], properties: { connectionId: { type: string, format: uuid }, url: { type: string, format: uri } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /connections/{connectionId}/terminal-sessions:
    post:
      tags: [Connections]
      operationId: createHostTerminalSession
      summary: Open a short-lived SSH terminal to a standalone ESXi host (the socket itself is a WebSocket)
      x-required-permission: platform.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/ConnectionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [username, password], properties: { username: { type: string, maxLength: 128 }, password: { type: string, maxLength: 1024 } } } } }
      responses:
        '201': { description: Terminal session created, content: { application/json: { schema: { type: object, required: [sessionId, socketUrl, expiresAt], properties: { sessionId: { type: string, format: uuid }, socketUrl: { type: string }, expiresAt: { type: string, format: date-time } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /schedules:
    get:
      tags: [Schedules]
      operationId: listSchedules
      summary: Scheduled operations, with when each runs next and what its latest run did
      x-required-permission: resource.view
      responses:
        '200': { description: The schedules, and the operations a schedule may use, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Schedules]
      operationId: createSchedule
      summary: Create a schedule
      description: An operation (power on, shut down, power off, suspend, restart guest, restart) on listed machines (at most 50) or on the machines that have a tag when the run happens, once, every day, or on chosen days of the week, at a time in a time zone. It runs as the person who made it, with that person's permissions at the time of each run. Names are unique whatever the case; at most 100 schedules. A time that has already passed is refused for a schedule that is on.
      x-required-permission: schedule.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleCreate' } } }
      responses:
        '201': { description: Schedule created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The name is taken (NUV_SCHEDULE_EXISTS) or the limit is reached (NUV_SCHEDULE_LIMIT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /schedules/preview:
    post:
      tags: [Schedules]
      operationId: previewSchedule
      summary: When a schedule would next run and which machines it would cover now, without saving it
      x-required-permission: schedule.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleCreate' } } }
      responses:
        '200': { description: The preview, content: { application/json: { schema: { $ref: '#/components/schemas/SchedulePreview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /schedules/{scheduleId}:
    parameters: [{ name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Schedules]
      operationId: updateSchedule
      summary: Change some fields of a schedule (optimistic concurrency with If-Match)
      description: Fields that no longer apply to the new shape (the date of a schedule that stops being once-only, the days of one that stops being weekly) are dropped. Turning a schedule on works out its next run again.
      x-required-permission: schedule.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleChange' } } }
      responses:
        '200': { description: Updated schedule, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The name is taken by another schedule (NUV_SCHEDULE_EXISTS), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Schedules]
      operationId: deleteSchedule
      summary: Delete a schedule; its history stays
      x-required-permission: schedule.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /schedules/{scheduleId}/run:
    post:
      tags: [Schedules]
      operationId: runSchedule
      summary: Run a schedule now, as the caller
      description: The operation is requested for each machine the schedule covers, exactly as when it is due. The schedule's own timing is not changed.
      x-required-permission: schedule.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: What the run did, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRun' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /schedule-runs:
    get:
      tags: [Schedules]
      operationId: listScheduleRuns
      summary: What schedules have done, newest first
      x-required-permission: resource.view
      parameters:
        - { name: scheduleId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: The runs, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleRunList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: The webhooks, without their addresses
      description: The address of a webhook usually carries a secret, so it is write-only; only where it goes (scheme and host) is shown.
      x-required-permission: alert.manage
      responses:
        '200': { description: The webhooks and the events and formats that can be chosen, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Add a webhook
      description: The address must be https (unless the installation allows http), carry no user name or password, and not be this machine or a link-local or reserved address; the name is checked again when a message is sent.
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookCreate' } } }
      responses:
        '201': { description: Created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: A webhook has that name (NUV_WEBHOOK_EXISTS) or the limit of 20 is reached (NUV_WEBHOOK_LIMIT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /webhooks/{webhookId}:
    parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Change some fields of a webhook (optimistic concurrency with If-Match)
      description: The address and the signing secret are kept unless they are given. An empty signing secret removes it. Turning a webhook on again does not send what happened while it was off.
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WebhookChange' } } }
      responses:
        '200': { description: Updated webhook, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Webhook' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The name is taken by another webhook (NUV_WEBHOOK_EXISTS), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook and its delivery history
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, required: [deleted], properties: { deleted: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/{webhookId}/test:
    parameters: [{ name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Webhooks]
      operationId: testWebhook
      summary: Send a test message now
      description: The result is returned and kept in the history. A test is not tried again, whatever the answer.
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: What happened, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDelivery' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhook-deliveries:
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: What was sent (or is waiting to be sent), newest first
      x-required-permission: alert.manage
      parameters:
        - { name: destinationId, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200': { description: The deliveries, content: { application/json: { schema: { $ref: '#/components/schemas/WebhookDeliveryList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capacity/compute:
    get:
      tags: [Capacity]
      operationId: listCapacityCompute
      summary: Every host and cluster with its processor and memory use and when each will be fully used
      description: Soonest to be fully used first. A cluster is the sum of its hosts that are up. Processor is in MHz and memory in bytes; the forecast is a straight line through six-hour averages of the last 14 days.
      x-required-permission: resource.view
      responses:
        '200': { description: The hosts and clusters, content: { application/json: { schema: { $ref: '#/components/schemas/CapacityComputeList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capacity/compute/{objectId}:
    get:
      tags: [Capacity]
      operationId: getCapacityCompute
      summary: One host or cluster with its history for a chart
      x-required-permission: resource.view
      parameters:
        - { name: objectId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: metric, in: query, schema: { type: string, enum: [cpu, memory] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }
      responses:
        '200': { description: The host or cluster, content: { application/json: { schema: { $ref: '#/components/schemas/CapacityComputeDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /capacity/datastores:
    get:
      tags: [Capacity]
      operationId: listCapacityDatastores
      summary: Every datastore with how full it is and when it will be full
      description: Soonest to be full first. The forecast is a straight line through the readings of the last 14 days (about one every half hour) and says how far to trust it.
      x-required-permission: resource.view
      responses:
        '200': { description: The datastores, content: { application/json: { schema: { $ref: '#/components/schemas/CapacityDatastoreList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /capacity/datastores/{datastoreId}:
    get:
      tags: [Capacity]
      operationId: getCapacityDatastore
      summary: One datastore with its history for a chart
      x-required-permission: resource.view
      parameters:
        - { name: datastoreId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90 } }
      responses:
        '200': { description: The datastore, content: { application/json: { schema: { $ref: '#/components/schemas/CapacityDatastoreDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /alert-metrics:
    get:
      tags: [Alerts]
      operationId: listAlertMetrics
      summary: What an alert rule can measure, and in what unit
      x-required-permission: resource.view
      responses:
        '200': { description: The metrics, content: { application/json: { schema: { $ref: '#/components/schemas/AlertMetricList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alert-rules:
    get:
      tags: [Alerts]
      operationId: listAlertRules
      summary: Alert rules, with how many alerts each has open
      x-required-permission: resource.view
      responses:
        '200': { description: All rules, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Alerts]
      operationId: createAlertRule
      summary: Create an alert rule
      description: A rule says that a measurement of a kind of thing, above or below a value, for a number of minutes, is a warning or critical. The name is unique whatever the case. At most 100 rules. A connection, if named, must exist.
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleCreate' } } }
      responses:
        '201': { description: Rule created, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: The name is taken (NUV_ALERT_RULE_EXISTS) or the limit is reached (NUV_ALERT_RULE_LIMIT), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /alert-rules/preview:
    post:
      tags: [Alerts]
      operationId: previewAlertRule
      summary: What a rule would match right now, without saving it or raising anything
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleCreate' } } }
      responses:
        '200': { description: The things that match now, strongest first, and how many could not be measured, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRulePreview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /alert-rules/{ruleId}:
    parameters: [{ name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      tags: [Alerts]
      operationId: updateAlertRule
      summary: Change some fields of a rule (optimistic concurrency with If-Match)
      description: Disabling a rule, or changing it so that it no longer covers a target, resolves the alerts it had open there on the next evaluation.
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AlertRuleChange' } } }
      responses:
        '200': { description: Updated rule, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AlertRule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The name is taken by another rule (NUV_ALERT_RULE_EXISTS), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Alerts]
      operationId: deleteAlertRule
      summary: Delete a rule; the alerts it raised are resolved and kept as history
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Deleted, content: { application/json: { schema: { type: object, required: [deleted, alertsResolved], properties: { deleted: { type: integer }, alertsResolved: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      summary: Threshold alerts (open ones first)
      description: status is open (active and acknowledged, the default), active, acknowledged, resolved or all.
      x-required-permission: resource.view
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, active, acknowledged, resolved, all] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: The alerts, content: { application/json: { schema: { $ref: '#/components/schemas/AlertList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /alerts/evaluate:
    post:
      tags: [Alerts]
      operationId: evaluateAlerts
      summary: Compare the latest measurements with the rules now (this also happens every minute)
      x-required-permission: alert.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: What the evaluation did, content: { application/json: { schema: { $ref: '#/components/schemas/AlertEvaluation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      operationId: acknowledgeAlert
      summary: Say that someone is looking at an alert; it stays open until it clears
      x-required-permission: resource.operate
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ name: alertId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: The alert, content: { application/json: { schema: { $ref: '#/components/schemas/Alert' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: A resolved alert cannot be acknowledged (NUV_ALERT_RESOLVED), content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /notifications:
    get:
      tags: [Alerts]
      operationId: listNotifications
      summary: The notification feed - alerts firing and resolving, and connection problems for those who may see connections - with how many are new to the caller
      x-required-permission: resource.view
      responses:
        '200': { description: The feed, newest first, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications/read:
    post:
      tags: [Alerts]
      operationId: markNotificationsRead
      summary: Mark everything in the feed as read, for the caller
      x-required-permission: resource.view
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: When, content: { application/json: { schema: { type: object, required: [lastReadAt], properties: { lastReadAt: { type: string, format: date-time } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connection-alerts:
    get:
      tags: [Connections]
      operationId: listConnectionAlerts
      x-required-permission: connection.view
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, acknowledged, recovered] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Connection health alerts, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionAlertList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connection-alerts/{alertId}/acknowledge:
    post:
      tags: [Connections]
      operationId: acknowledgeConnectionAlert
      x-required-permission: connection.manage
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters: [{ in: path, name: alertId, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: The acknowledged alert, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionAlert' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      x-required-permission: resource.view
      parameters:
        - { in: query, name: connectionId, schema: { type: string, format: uuid } }
        - { in: query, name: resourceType, schema: { type: string } }
        - { in: query, name: lifecycleState, schema: { type: string } }
        - { in: query, name: search, schema: { type: string } }
        - { in: query, name: tag, style: form, explode: true, description: 'Keep only resources with this tag; repeat the parameter to require several. "env" matches any value of the key, "env=prod" matches that value. Keys are compared in lower case.', schema: { type: array, items: { type: string } } }
      responses:
        '200': { description: Normalized infrastructure resources, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /infrastructure:
    get:
      tags: [Resources]
      operationId: listInfrastructure
      summary: The datacenters, clusters, hosts, datastores and networks providers report besides virtual machines
      description: Kept apart from /resources, so nothing that lists or counts virtual machines sees them. Objects whose connection was deleted are left out unless lifecycleState=deleted is asked for. A virtual machine's placement is in its providerMetadata.placement (hostNativeId, datastoreNativeIds, networkNativeIds) and refers to these objects by nativeId within the same connection.
      x-required-permission: resource.view
      parameters:
        - { in: query, name: connectionId, schema: { type: string, format: uuid } }
        - { in: query, name: kind, schema: { type: string, enum: [datacenter, cluster, host, datastore, network] } }
        - { in: query, name: lifecycleState, schema: { type: string, enum: [active, missing, deleted] } }
      responses:
        '200': { description: The infrastructure objects, content: { application/json: { schema: { $ref: '#/components/schemas/InfrastructureList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tags:
    get:
      tags: [Resources]
      operationId: listTags
      summary: Every tag key in use with its values and how many resources carry each
      description: Nuvrion's own tags only (tags a provider reports are on each resource's tags list with source "provider").
      x-required-permission: resource.view
      responses:
        '200': { description: The tags in use, content: { application/json: { schema: { $ref: '#/components/schemas/TagCatalog' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tag-operations:
    post:
      tags: [Resources]
      operationId: applyTagOperation
      summary: Set and remove Nuvrion tags on one or many resources, all or nothing
      description: Keys are lower case and may not start with a reserved prefix (nuvrion:, aws:, azure:, vmware:, microsoft:). At most 200 resources, 20 tags set and 20 removed per request, and 50 tags on a resource. Nothing is changed if any resource is unknown or any tag is invalid. Each resource whose tags actually change gets a resource.tags_updated audit event.
      x-required-permission: resource.tag
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TagOperationRequest' } } }
      responses:
        '200': { description: The tags of each resource after the change, content: { application/json: { schema: { $ref: '#/components/schemas/TagOperationResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
