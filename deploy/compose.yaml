services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: nuvrion, POSTGRES_USER: nuvrion, POSTGRES_PASSWORD: nuvrion }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nuvrion"], interval: 5s, timeout: 3s, retries: 10 }
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: nuvrion, RABBITMQ_DEFAULT_PASS: nuvrion }
    ports: ["5672:5672", "15672:15672"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, timeout: 5s, retries: 12 }
